# Static hosting for the built SPA (dist/). Put behind HTTPS (e.g. Cloudflare / a load balancer with TLS).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  gzip on; gzip_types text/css application/javascript application/json image/svg+xml;

  # Hashed assets: cache forever
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

  # API is served by FastAPI
  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }

  # SPA fallback so /campaigns/education-kits works on refresh
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
