# Local full stack: PostgreSQL + FastAPI + static frontend. Copy backend/.env.example to backend/.env first.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: udaan
      POSTGRES_USER: udaan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U udaan"], interval: 5s, retries: 10 }
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://udaan:${POSTGRES_PASSWORD:-change-me}@db:5432/udaan
    depends_on: { db: { condition: service_healthy } }
  web:
    build:
      context: ./frontend
      args: { VITE_API_BASE_URL: "/" }
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  pgdata:
